name: Article scraper

on:
  schedule:
    # Check every five minutes; the gate selects 100 slots randomly per UTC day.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized article URL to check"
        required: true
        type: string
      executions:
        description: "Number of scrapes for this workflow run"
        required: false
        default: "1"
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ inputs.target_url || vars.TARGET_URL }}
      EXECUTIONS: ${{ inputs.executions || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select random daily slot
        id: random_slot
        env:
          SCHEDULE_SEED: ${{ secrets.SCHEDULE_SEED || github.repository }}
        run: |
          echo "Today's selected UTC timestamps:"
          python random_schedule.py --show
          echo "run=$(python random_schedule.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }})" >> "$GITHUB_OUTPUT"
      - name: Skip unselected scheduled slot
        if: github.event_name == 'schedule' && steps.random_slot.outputs.run != 'true'
        run: echo "This is not one of today's 100 selected scrape times."
      - name: Install scraper dependencies
        if: steps.random_slot.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run scraper
        if: steps.random_slot.outputs.run == 'true'
        run: |
          mkdir -p scrape-results
          failures=0
          for run in $(seq 1 "$EXECUTIONS"); do
            if python scrape.py "$TARGET_URL" --scroll --output "scrape-results/run-${run}.html" > "scrape-results/run-${run}.stdout.html"; then
              printf 'Succeeded' > "scrape-results/status-${run}.txt"
            else
              printf 'Failed' > "scrape-results/status-${run}.txt"
              failures=$((failures + 1))
            fi
          done
          python - <<'PY'
          import html
          import os
          from pathlib import Path

          results_dir = Path("scrape-results")
          total = int(os.environ["EXECUTIONS"])
          rows = []
          for status_file in sorted(
              results_dir.glob("status-*.txt"),
              key=lambda path: int(path.stem.split("-")[1]),
          ):
              run_number = status_file.stem.split("-")[1]
              status = status_file.read_text(encoding="utf-8")
              status_class = "success" if status == "Succeeded" else "failure"
              rows.append(
                  f"<tr><td>{run_number}</td><td>{total}</td>"
                  f"<td>{html.escape(os.environ['TARGET_URL'])}</td>"
                  f'<td class="{status_class}">{status}</td></tr>'
              )

          succeeded = sum(
              status_file.read_text(encoding="utf-8") == "Succeeded"
              for status_file in results_dir.glob("status-*.txt")
          )
          report = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Scrape results</title>
            <style>
              body {{ font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1100px; padding: 0 1rem; }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ border: 1px solid #bbb; padding: .6rem; text-align: left; }}
              th {{ background: #eee; }}
              .success {{ color: #16803c; font-weight: 700; }}
              .failure {{ color: #c62828; font-weight: 700; }}
            </style>
          </head>
          <body>
            <h1>Scrape results</h1>
            <p>{succeeded} of {total} scrapes succeeded.</p>
            <table>
              <thead><tr><th>Run</th><th>Total scrapes</th><th>URL</th><th>Status</th></tr></thead>
              <tbody>{''.join(rows)}</tbody>
            </table>
          </body>
          </html>
          """
          (results_dir / "index.html").write_text(report, encoding="utf-8")
          PY
          exit "$failures"
      - name: Upload scrape results
        if: always() && steps.random_slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: scrape-results/
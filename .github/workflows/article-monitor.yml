name: Article scraper

permissions:
  contents: write

concurrency:
  group: scrape-main
  cancel-in-progress: false

on:
  schedule:
    # Check every five minutes; the gate selects 100 slots randomly per UTC day.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized article URL to check"
        required: true
        type: string
      executions:
        description: "Number of scrapes for this workflow run"
        required: false
        default: "1"
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ inputs.target_url || vars.TARGET_URL }}
      EXECUTIONS: ${{ inputs.executions || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select random daily slot
        id: random_slot
        env:
          SCHEDULE_SEED: ${{ secrets.SCHEDULE_SEED || github.repository }}
        run: |
          echo "Today's selected UTC timestamps:"
          python random_schedule.py --show
          echo "run=$(python random_schedule.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }})" >> "$GITHUB_OUTPUT"
      - name: Skip unselected scheduled slot
        if: github.event_name == 'schedule' && steps.random_slot.outputs.run != 'true'
        run: echo "This is not one of today's 100 selected scrape times."
      - name: Install scraper dependencies
        if: steps.random_slot.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run scraper
        if: steps.random_slot.outputs.run == 'true'
        run: |
          mkdir -p scrape-results
          failures=0
          for run in $(seq 1 "$EXECUTIONS"); do
            if python scrape.py "$TARGET_URL" --scroll --output "scrape-results/run-${run}.html" > "scrape-results/run-${run}.stdout.html"; then
              printf 'Succeeded' > "scrape-results/status-${run}.txt"
            else
              printf 'Failed' > "scrape-results/status-${run}.txt"
              failures=$((failures + 1))
            fi
          done
          exit "$failures"
      - name: Update committed HTML report
        if: always() && steps.random_slot.outputs.run == 'true'
        run: |
          python update_report.py \
            --url "$TARGET_URL" \
            --workflow-run "${{ github.run_number }}" \
            --total "$EXECUTIONS"
      - name: Commit report to main
        if: always() && steps.random_slot.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scrape-history.json
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Update scrape results"
            git push origin HEAD:main
          fi
      - name: Upload scrape results
        if: always() && steps.random_slot.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: |
            index.html
            scrape-history.json
            scrape-results/
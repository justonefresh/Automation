name: Article scraper

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized article URL to check"
        required: true
        type: string
      executions:
        description: "Number of scrapes for this workflow run"
        required: false
        default: "1"
        type: string

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: ${{ inputs.target_url || vars.TARGET_URL }}
      EXECUTIONS: ${{ inputs.executions || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run scraper
        run: |
          mkdir -p scrape-results
          for run in $(seq 1 "$EXECUTIONS"); do
            python scrape.py "$TARGET_URL" --scroll --output "scrape-results/run-${run}.html" > "scrape-results/run-${run}.stdout.html"
          done
      - name: Upload scrape results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: scrape-results/